<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Password Reset</title><style>body{font-family:Arial;background:#eef2f7;margin:0;display:grid;place-items:center;min-height:100vh}.card{background:white;padding:28px;border-radius:14px;box-shadow:0 12px 35px #0002;width:min(420px,90vw)}h1{font-size:22px}input,button{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border:1px solid #ccd3dd;border-radius:8px}button{background:#194f90;color:#fff;border:0;font-weight:bold}.error{background:#fee2e2;padding:10px;border-radius:8px}.success{background:#dcfce7;padding:10px;border-radius:8px}</style></head><body><div class="card"><h1>Reset trên máy chủ</h1><p>Trang này chỉ hoạt động khi mở bằng localhost trên chính máy chạy Agent.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="{{category}}">{{message}}</div>{% endfor %}{% endwith %}<form method="post"><input type="password" name="new_password" placeholder="Mật khẩu mới (tối thiểu 10 ký tự)" required><input type="password" name="confirm_password" placeholder="Nhập lại mật khẩu mới" required><button>Đặt lại mật khẩu</button></form></div></body></html>
