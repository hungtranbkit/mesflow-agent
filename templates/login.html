<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workshop Update Agent</title><style>body{font-family:Arial;background:#eef2f7;margin:0;display:grid;place-items:center;min-height:100vh}.card{background:white;padding:28px;border-radius:14px;box-shadow:0 12px 35px #0002;width:min(380px,90vw)}h1{font-size:22px}input,button{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border:1px solid #ccd3dd;border-radius:8px}button{background:#194f90;color:#fff;border:0;font-weight:bold}.error{background:#fee2e2;padding:10px;border-radius:8px}</style></head><body><div class="card"><h1>Workshop Update Agent</h1><p>Đăng nhập quản trị server</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="{{category}}">{{message}}</div>{% endfor %}{% endwith %}<form method="post"><input name="username" value="admin" autocomplete="username"><input type="password" name="password" placeholder="Mật khẩu" autocomplete="current-password" required><button>Đăng nhập</button></form><p style="text-align:center;margin:12px 0 0"><a href="{{url_for('forgot_password')}}" style="color:#194f90">Quên mật khẩu?</a></p></div></body></html>
