<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MESFlow Operations · Đăng nhập</title><style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#eef2f7;margin:0;display:grid;place-items:center;min-height:100vh}.card{background:white;padding:28px;border-radius:10px;border:1px solid #dce3ec;box-shadow:0 12px 35px #0002;width:min(380px,90vw)}.brand{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#1760aa;margin:0 0 4px}h1{font-size:20px;margin:0}p.sub{color:#657487;font-size:13px;margin:6px 0 18px}input,button{width:100%;box-sizing:border-box;padding:11px 12px;margin:6px 0;border:1px solid #ccd3dd;border-radius:6px;font-size:14px}button{background:#102f52;color:#fff;border:0;font-weight:700;cursor:pointer;margin-top:8px}button:hover{background:#0b223b}.error{background:#fde9e7;color:#b3261e;padding:10px;border-radius:6px;font-size:13px}</style></head><body><div class="card"><p class="brand">MESFlow Operations</p><h1>Deploy Agent</h1><p class="sub">Đăng nhập quản trị server</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="{{category}}">{{message}}</div>{% endfor %}{% endwith %}<form method="post"><input name="username" value="admin" autocomplete="username"><input type="password" name="password" placeholder="Mật khẩu" autocomplete="current-password" required><button>Đăng nhập</button></form><p style="text-align:center;margin:12px 0 0"><a href="{{url_for('forgot_password')}}" style="color:#1760aa">Quên mật khẩu?</a></p></div></body></html>
