<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESP OTA</title><style>body{font:15px system-ui;background:#f4f7fb;color:#172033;margin:0;padding:24px}.wrap{max-width:1100px;margin:auto}.card{background:#fff;border:1px solid #dbe3ee;border-radius:12px;padding:20px;margin:14px 0}label{display:block;font-weight:650;margin:12px 0 6px}input,button{font:inherit;padding:10px;border:1px solid #cbd5e1;border-radius:7px}input[type=file]{width:100%;box-sizing:border-box}button{background:#1760aa;color:#fff;border:0;cursor:pointer;font-weight:700}.primary{font-size:17px;padding:12px 22px}.devices{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px}.device{display:flex;gap:10px;align-items:center;border:1px solid #e2e8f0;border-radius:8px;padding:10px}.device small{display:block;color:#64748b}.offline{opacity:.55}.status{margin:8px 0;padding:10px;border-radius:8px;background:#eef4ff}.ok{color:#087443}.bad{color:#b42318}</style></head><body><main class="wrap"><section class="card"><h1>ESP Firmware OTA</h1><p>Upload một OTA package ZIP, chọn kiosk và bấm <b>FLASH OTA</b>.</p><form id="flashForm"><label>OTA package (.zip)</label><input id="firmware" name="firmware" type="file" accept=".zip" required><p>Version/build/hardware được đọc tự động từ manifest trong ZIP.</p><label>Kiosk</label><div id="devices" class="devices">Đang tải thiết bị…</div><p><button class="primary" type="submit">FLASH OTA</button></p></form><div id="message" class="status" hidden></div></section><section class="card"><h2>Trạng thái</h2><div id="jobs">Chưa có job.</div></section></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=v=>v?new Date(Number(v)*1000).toLocaleString('vi-VN'):'—';
async function loadDevices(){const r=await fetch('/agent/api/esp-ota/devices');const d=await r.json();if(!r.ok)throw Error(d.error||'Không tải được kiosk');document.querySelector('#devices').innerHTML=(d.items||[]).map(x=>`<label class="device ${x.online?'':'offline'}"><input type="checkbox" value="${esc(x.kiosk_id)}" ${x.online?'':'disabled'}><span><b>${esc(x.kiosk_name||x.kiosk_id)}</b><small>${esc(x.kiosk_id)} · ${x.online?'Online':'Offline'} · ${esc(x.firmware_version||'—')}</small></span></label>`).join('')||'Không có kiosk.'}
async function cancelJob(id){if(!confirm('Hủy job OTA này?'))return;await fetch('/agent/api/esp-ota/jobs/'+encodeURIComponent(id)+'/cancel',{method:'POST'});await loadJobs()}
function drawJob(j){const active=!['SUCCESS','FAILED','CANCELLED'].includes(j.status);return `<div><b>${esc(j.version)} · ${esc(j.id.slice(0,8))}</b> ${active?`<button type="button" onclick="cancelJob('${esc(j.id)}')">HỦY JOB</button>`:''}${j.devices.map(x=>`<div class="status"><b>${esc(x.kiosk_id)}</b> — <span class="${x.status==='SUCCESS'?'ok':x.status==='FAILED'?'bad':''}">${x.status==='PENDING'?'Đang chờ thiết bị kiểm tra cập nhật':esc(x.status)}</span>${x.status==='PENDING'?`<small>Last transition: ${esc(fmt(x.updated_at))}</small>`:''}${x.error?`<small>${esc(x.error)}</small>`:''}</div>`).join('')}</div>`}
async function loadJobs(){const r=await fetch('/agent/api/esp-ota/jobs');if(!r.ok)return;const d=await r.json();document.querySelector('#jobs').innerHTML=(d.items||[]).map(drawJob).join('')||'Chưa có job.'}
document.querySelector('#flashForm').onsubmit=async e=>{e.preventDefault();const ids=[...document.querySelectorAll('#devices input:checked')].map(x=>x.value);if(!ids.length)return alert('Chọn ít nhất một kiosk online.');const fd=new FormData(e.target);fd.set('kiosk_ids',JSON.stringify(ids));const m=document.querySelector('#message');m.hidden=false;m.textContent='Đang đọc manifest và tạo job…';const r=await fetch('/agent/api/esp-ota/upload',{method:'POST',body:fd});const d=await r.json();m.textContent=r.ok?`Job ${d.job.id.slice(0,8)} · firmware ${d.job.version} đã bắt đầu.`:(d.error||'Upload thất bại');if(r.ok){e.target.reset();await loadJobs()}};loadDevices().catch(e=>{document.querySelector('#message').hidden=false;document.querySelector('#message').textContent=e.message});loadJobs();setInterval(loadJobs,3000);setInterval(()=>loadDevices().catch(()=>{}),15000);
</script></body></html>
