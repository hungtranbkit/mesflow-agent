services:
  mesflow-deploy-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${AGENT_IMAGE:-mesflow-deploy-agent:2.24.3}
    container_name: mesflow-deploy-agent
    restart: unless-stopped
    environment:
      MESFLOW_AGENT_RUNTIME: docker-linux
      SERVER_ROLE: ${SERVER_ROLE:-PRODUCTION_TEST}
      MESFLOW_BUILD_ENABLED: ${MESFLOW_BUILD_ENABLED:-0}
      MESFLOW_SOURCE_DIR: ${MESFLOW_SOURCE_DIR:-/workspace/mesflow/mesflow}
      QA_CENTER_SOURCE_DIR: ${QA_CENTER_SOURCE_DIR:-/workspace/mesflow/qa-center}
      MESFLOW_AGENT_DEPLOY_ENABLED: "1"
      MESFLOW_AGENT_HOST_OPS_ENABLED: "0"
      WORKSHOP_AGENT_HOME: /data
      # Empty means the Agent generates a one-time first-login credential;
      # never ship a shared default password in source packages.
      MESFLOW_AGENT_ADMIN_PASSWORD: ${MESFLOW_AGENT_ADMIN_PASSWORD:-}
      WORKSHOP_TARGET_HOME: /opt/mesflow
      WORKSHOP_MES_URL: http://mesflow-app:8080
      MESFLOW_INTERNAL_API_TOKEN: ${MESFLOW_INTERNAL_API_TOKEN:-}
      MESFLOW_DEPLOY_AGENT_TOKEN: ${MESFLOW_DEPLOY_AGENT_TOKEN:-}
      MESFLOW_QA_URL: http://mesflow-qa-center:8095
      # Production Test promotion target. Values come only from the calling
      # shell's environment (or an untracked, gitignored env file) at
      # `docker compose up` time -- never hardcoded here and never
      # committed. See docs/operations/BUILD_AND_PROMOTE.md.
      MESFLOW_PRODUCTION_TEST_AGENT_URL: ${MESFLOW_PRODUCTION_TEST_AGENT_URL:-}
      MESFLOW_PRODUCTION_TEST_AGENT_USER: ${MESFLOW_PRODUCTION_TEST_AGENT_USER:-}
      MESFLOW_PRODUCTION_TEST_AGENT_PASSWORD: ${MESFLOW_PRODUCTION_TEST_AGENT_PASSWORD:-}
      # Production target: read-only use only (health/version/schema/disk/
      # backup preflight via GET requests). The Agent never uploads a
      # release or calls /deploy/<version> against this target except
      # through the explicitly human-gated Promote Production action, which
      # this Agent build does not execute (see release_manager_promote_production).
      MESFLOW_PRODUCTION_AGENT_URL: ${MESFLOW_PRODUCTION_AGENT_URL:-}
      MESFLOW_PRODUCTION_AGENT_USER: ${MESFLOW_PRODUCTION_AGENT_USER:-}
      MESFLOW_PRODUCTION_AGENT_PASSWORD: ${MESFLOW_PRODUCTION_AGENT_PASSWORD:-}
      # Host-side updater targets (safe, no-SSH Agent updates). Bearer
      # token auth only, never a value committed here. URL historically
      # pointed at deploy-agent/updater/ (:8099); migrating to bootstrap/
      # (:8098), which serves the identical POST /updater/update contract --
      # see reports/BOOTSTRAP_AGENT_UPDATER_CONSOLIDATION.md before changing
      # these values on a real target. Only the port in the URL changes;
      # the token value should be copied over unchanged, not rotated.
      MESFLOW_PRODUCTION_TEST_AGENT_UPDATER_URL: ${MESFLOW_PRODUCTION_TEST_AGENT_UPDATER_URL:-}
      MESFLOW_PRODUCTION_TEST_AGENT_UPDATER_TOKEN: ${MESFLOW_PRODUCTION_TEST_AGENT_UPDATER_TOKEN:-}
      MESFLOW_PRODUCTION_AGENT_UPDATER_URL: ${MESFLOW_PRODUCTION_AGENT_UPDATER_URL:-}
      MESFLOW_PRODUCTION_AGENT_UPDATER_TOKEN: ${MESFLOW_PRODUCTION_AGENT_UPDATER_TOKEN:-}
    volumes:
      - ${MESFLOW_AGENT_DATA_DIR:-/var/lib/mesflow-deploy-agent}:/data
      - /var/run/docker.sock:/var/run/docker.sock
      # Same absolute host/container path is intentional so Compose bind paths remain valid.
      - /opt/mesflow:/opt/mesflow
      - /opt/mesflow-qa-center:/opt/mesflow-qa-center
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mesflow-edge

networks:
  mesflow-edge:
    external: true
